[workspace]
resolver = "2"
members = [
    "crates/rdp123-core",
    "crates/rdp123-app",
    "xtask",
]

[workspace.package]
version = "0.6.13"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"

[workspace.dependencies]
# --- RDP protocol (IronRDP) ---
ironrdp = { version = "0.17", features = [
    "connector",
    "session",
    "graphics",
    "input",
    "svc",
    "dvc",
    "cliprdr",
    "displaycontrol",
    "rdpsnd",
    "rdpdr",
    "pdu",
    "core",
] }
ironrdp-tokio = "0.10"
# Graphics Pipeline (EGFX): AVC420 via bundled OpenH264 (compiled from source,
# so end users need no binary downloads).
ironrdp-egfx = { version = "0.3", features = ["openh264-bundled"] }

# --- async / networking ---
tokio = { version = "1.52", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "io-util",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
aws-lc-rs = "1.17"

# --- macOS platform ---
# objc2 framework crates activate ~all classes via default features; the
# inter-crate bridges (CoreFoundation/QuartzCore/CoreGraphics) must be opted in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "objc2-core-foundation",
    "objc2-quartz-core",
    "objc2-core-graphics",
] }
objc2-core-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-io-surface = { version = "0.3", features = ["libc"] }
objc2-service-management = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
] }
block2 = "0.6"
dispatch2 = "0.3"
# H.264 hardware decode (VideoToolbox) for the graphics pipeline.
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
    "VTBase",
    "VTDecompressionSession",
    "VTDecompressionProperties",
    "VTErrors",
    "VTSession",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-core-video",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
yuv = { version = "0.8", default-features = false }
openh264 = { version = "0.9", default-features = false, features = ["source"] }
security-framework = "3"

# --- serialization / storage ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# --- utilities ---
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
base64 = "0.23"
url = "2.5"

# internal
rdp123-core = { path = "crates/rdp123-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# ironrdp-connector with two additions:
# - a `support_gfx` Config flag that advertises
#   RNS_UD_CS_SUPPORT_DYNVC_GFX_PROTOCOL (required for the server to offer the
#   EGFX graphics pipeline; upstream added this in 5bdb6798, #1237, unreleased
#   as of 0.10.0).
# - a reply to the connect-time Bandwidth Measure Stop, backported from
#   upstream 6a499fae (#1530) and 36a848e0 (#1559), unreleased as of 0.10.0.
#   Servers built on FreeRDP's server library, such as GNOME Remote Desktop,
#   wait for this reply, so without it the connection stalls after sign-in.
#   Upstream times the window from arrival times the driver passes in; 0.10.0's
#   driver has no such input, so this uses the time each PDU is processed.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
# ironrdp-graphics: fixes RemoteFX Progressive context lifetime, signed
# fixed-point color conversion, implicit full-quality upgrades, region DWT
# selection, and continuous SRL/RAW stream decoding. These are required for
# Windows RDP 8 frames to refine cleanly instead of failing after the first
# frame or rendering black/white block artifacts.
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
# ironrdp-egfx 0.3.0 from crates.io, vendored to carry AVC420 fixes for servers
# built on FreeRDP's server library, such as GNOME Remote Desktop:
# - Annex B input is decoded as sent instead of being misread as
#   length-prefixed NAL units (same detection as upstream PR #1986, open).
# - YUV is converted as full-range BT.709 instead of limited-range BT.601
#   (backport of upstream 9542e017, #1923, unreleased as of 0.3.0).
ironrdp-egfx = { path = "vendor/ironrdp-egfx" }
